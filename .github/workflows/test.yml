name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: harness/package-lock.json

      # Skip the postinstall playwright download here; we install the browser
      # WITH its system deps in the next step (needed on CI runners).
      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      # Boots the mgba core headlessly (software WebGL via SwiftShader) and runs
      # the smoke, determinism/input, and memory-read tests.
      - run: npm test
